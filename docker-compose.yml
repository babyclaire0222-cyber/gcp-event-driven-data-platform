# Local development: hot reload, talks to a real (dev) GCP project using your
# gcloud Application Default Credentials. The pipeline (Pub/Sub -> ingest function)
# runs in GCP, so an upload here lands in BigQuery exactly as it would in prod.
#
#   gcloud auth application-default login
#   cp .env.example .env   # set GCP_PROJECT and BUCKET_NAME
#   docker compose up --build
services:
  webapp:
    build: ./webapp
    command: flask --app main run --host 0.0.0.0 --port 8080 --debug
    ports:
      - "127.0.0.1:8080:8080"  # debug mode: never expose beyond localhost
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ./webapp:/app
      - ${GCLOUD_CONFIG_DIR:-~/.config/gcloud}:/gcloud:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
