# Observability overlay: Prometheus scrapes webapp:8080/metrics, Grafana shows the
# provisioned "Webapp overview" dashboard. Combine with either stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up --build
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up --build
#
# Prometheus: http://localhost:9090   Grafana: http://localhost:3000
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - webapp

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/webapp.json
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only anonymous access; the port is bound to localhost only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
