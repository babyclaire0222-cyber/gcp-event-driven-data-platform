name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            webapp/requirements.txt
            functions/ingest/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
      - name: Shell syntax
        run: for f in deployment/*.sh; do bash -n "$f"; done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Cloud Run image
        run: docker build -t webapp:ci ./webapp
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 -e GCP_PROJECT=ci -e BUCKET_NAME=ci webapp:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
