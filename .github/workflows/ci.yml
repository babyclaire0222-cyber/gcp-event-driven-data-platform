name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            webapp/requirements.txt
            functions/ingest/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
      - name: Shell syntax
        run: for f in deployment/*.sh; do bash -n "$f"; done

  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config + alert rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro"             --entrypoint promtool prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
      - name: Grafana dashboard is valid JSON
        run: python -m json.tool monitoring/grafana/dashboards/webapp.json > /dev/null

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Cloud Run image
        run: docker build -t webapp:ci ./webapp
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 -e GCP_PROJECT=ci -e BUCKET_NAME=ci webapp:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && curl -fsS localhost:8080/metrics | grep -q webapp_http_requests_total && exit 0; sleep 1; done
          docker logs app; exit 1
