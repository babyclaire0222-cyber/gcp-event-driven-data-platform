name: Deploy

# Manual only: deploying needs a GCP project with create_resources.sh already run.
# Required repo settings:
#   Variables: PROJECT_ID (and optionally REGION)
#   Secrets:   GCP_SA_KEY (JSON key for a deployer service account)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION || 'asia-southeast1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.PROJECT_ID }}
          install_components: beta
      - run: ./deployment/deploy.sh
