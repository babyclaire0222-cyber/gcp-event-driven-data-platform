# Local Jenkins that runs ./Jenkinsfile against the GitHub repo.
#
#   docker compose -f docker-compose.jenkins.yml up -d --build
#   open http://localhost:8081  (admin / $JENKINS_ADMIN_PASSWORD, default "admin")
#
# The pipeline job is created automatically and polls the repo every 5 minutes.
services:
  jenkins:
    build: ./jenkins
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      REPO_URL: ${REPO_URL:-https://github.com/babyclaire0222-cyber/gcp-event-driven-data-platform.git}
      REPO_BRANCH: ${REPO_BRANCH:-master}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=${ALLOW_LOCAL_CHECKOUT:-false}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
